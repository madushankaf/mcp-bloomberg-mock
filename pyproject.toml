[project]
name = "bloomberg-mcp"
version = "0.1.0"
description = "MCP server exposing Bloomberg BLPAPI (Desktop API / SAPI / B-PIPE) over streamable HTTP at /mcp"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.1,<3",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Bloomberg's own SDK. Only installable from Bloomberg's private index:
#   uv pip install --index-url https://blpapi.bloomberg.com/repository/releases/python/simple/ blpapi
blpapi = ["blpapi>=3.24.11"]

[project.scripts]
bloomberg-mcp = "bloomberg_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bloomberg_mcp"]

# `uv pip install blpapi` works out of the box thanks to this index.
[[tool.uv.index]]
name = "bloomberg"
url = "https://blpapi.bloomberg.com/repository/releases/python/simple/"
explicit = true

[tool.uv.sources]
blpapi = { index = "bloomberg" }
